name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check site URL is set
        run: |
          if grep -q "YOUR-SITE-URL-HERE" capacitor.config.json; then
            echo "capacitor.config.json lo server.url ni mee deployed https URL tho marchandi"; exit 1
          fi

      - name: Install
        run: npm install

      - name: Web files
        run: |
          mkdir -p www
          cp index.html app.js style.css config.js sw.js manifest.json icon.svg favicon.ico www/

      - name: Add Android platform
        run: npx cap add android

      - name: Screenshot block, Google login deep link, back button and exit dialog, permissions
        run: |
          mkdir -p android/app/src/main/java/com/ntalk/app
          cat > android/app/src/main/java/com/ntalk/app/MainActivity.java <<'EOF'
          package com.ntalk.app;

          import android.app.AlertDialog;
          import android.content.DialogInterface;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.WindowManager;
          import android.webkit.ValueCallback;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              private AlertDialog exitDialog;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE,
                                       WindowManager.LayoutParams.FLAG_SECURE);
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  Uri data = intent == null ? null : intent.getData();
                  if (data != null && "com.ntalk.app".equals(data.getScheme())) {
                      String js = "window.ntalkAuthCallback && window.ntalkAuthCallback("
                              + JSONObject.quote(data.toString()) + ")";
                      getBridge().getWebView().evaluateJavascript(js, null);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (exitDialog != null && exitDialog.isShowing()) {
                      exitDialog.dismiss();
                      finish();
                      return;
                  }
                  getBridge().getWebView().evaluateJavascript(
                      "typeof topLayerClose==='function' && topLayerClose()",
                      new ValueCallback<String>() {
                          @Override
                          public void onReceiveValue(String value) {
                              if (!"true".equals(value)) {
                                  showExitDialog();
                              }
                          }
                      });
              }

              private void showExitDialog() {
                  if (isFinishing()) return;
                  if (exitDialog != null && exitDialog.isShowing()) return;
                  AlertDialog.Builder b = new AlertDialog.Builder(this);
                  b.setTitle("Exit NTalk?");
                  b.setMessage("Do you want to close the app?");
                  b.setPositiveButton("Yes", new DialogInterface.OnClickListener() {
                      @Override
                      public void onClick(DialogInterface d, int which) {
                          finish();
                      }
                  });
                  b.setNegativeButton("No", null);
                  exitDialog = b.create();
                  exitDialog.setCanceledOnTouchOutside(false);
                  exitDialog.setOnKeyListener(new DialogInterface.OnKeyListener() {
                      @Override
                      public boolean onKey(DialogInterface d, int keyCode, KeyEvent event) {
                          if (keyCode == KeyEvent.KEYCODE_BACK && event.getAction() == KeyEvent.ACTION_UP) {
                              d.dismiss();
                              finish();
                              return true;
                          }
                          return false;
                      }
                  });
                  exitDialog.setOnCancelListener(new DialogInterface.OnCancelListener() {
                      @Override
                      public void onCancel(DialogInterface d) {
                          finish();
                      }
                  });
                  exitDialog.show();
                  int pink = 0xFFFF4D9D;
                  exitDialog.getButton(AlertDialog.BUTTON_POSITIVE).setTextColor(pink);
                  exitDialog.getButton(AlertDialog.BUTTON_NEGATIVE).setTextColor(pink);
              }
          }
          EOF
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          extra='''
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
          '''
          marker='<uses-permission android:name="android.permission.INTERNET" />'
          assert marker in s
          s=s.replace(marker, marker+extra)
          deeplink='''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="com.ntalk.app" android:host="auth" />
                  </intent-filter>
          '''
          assert '</activity>' in s
          s=s.replace('</activity>', deeplink+'        </activity>',1)
          open(p,'w').write(s)
          PY
          grep -c FLAG_SECURE android/app/src/main/java/com/ntalk/app/MainActivity.java
          grep -c 'android:scheme="com.ntalk.app"' android/app/src/main/AndroidManifest.xml

      - name: Prepare icon source
        run: |
          mkdir -p assets
          cp icon.svg assets/icon-only.svg

      - name: App icon
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#2a0f20' --iconBackgroundColorDark '#2a0f20'

      - name: Sync
        run: npx cap sync android

      - name: Remove adaptive icon XML (avoid broken background ref)
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NTalk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
