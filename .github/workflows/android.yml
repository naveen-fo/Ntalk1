name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check site URL is set
        run: |
          if grep -q "YOUR-SITE-URL-HERE" capacitor.config.json; then
            echo "capacitor.config.json lo server.url ni mee deployed https URL tho marchandi"; exit 1
          fi

      - name: Install
        run: npm install

      - name: Web files
        run: |
          mkdir -p www
          cp index.html app.js style.css config.js sw.js manifest.json icon.svg favicon.ico www/

      - name: Add Android platform
        run: npx cap add android

      - name: Screenshot block (FLAG_SECURE) + permissions
        run: |
          mkdir -p android/app/src/main/java/com/ntalk/app
          cat > android/app/src/main/java/com/ntalk/app/MainActivity.java <<'EOF'
          package com.ntalk.app;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE,
                                       WindowManager.LayoutParams.FLAG_SECURE);
              }
          }
          EOF
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          extra='''
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />
          '''
          marker='<uses-permission android:name="android.permission.INTERNET" />'
          assert marker in s
          s=s.replace(marker, marker+extra)
          open(p,'w').write(s)
          PY
          grep -c FLAG_SECURE android/app/src/main/java/com/ntalk/app/MainActivity.java
      - name: Prepare icon source
        run: |
          mkdir -p assets
          cp icon.svg assets/icon-only.svg
          cp icon.svg assets/icon-foreground.svg

      - name: App icon
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0b1026' --iconBackgroundColorDark '#0b1026'

      - name: Sync
        run: npx cap sync android
      - name: Sync
        run: npx cap sync android

      - name: Remove adaptive icon XML (avoid broken background ref)
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NTalk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
